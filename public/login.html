<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Masuk - PerpusKu</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="login">

  <header class="site-header">
    <nav class="container navbar" aria-label="Navigasi utama">
      <a href="index.html" class="brand">Perpus<span>Ku</span></a>
      <button class="nav-toggle" aria-label="Buka menu">&#9776;</button>
      <ul class="nav-menu">
        <li><a href="index.html">Beranda</a></li>
        <li><a href="katalog.html">Katalog</a></li>
        <li><a href="login.html">Masuk</a></li>
        <li><a href="register.html" class="btn btn-accent btn-sm">Daftar</a></li>
      </ul>
    </nav>
  </header>

  <main class="auth-wrapper">
    <section class="card auth-card">
      <h1>Masuk</h1>
      <p class="sub">Masuk untuk meminjam dan mengelola peminjamanmu.</p>

      <div id="form-alert" class="alert" role="alert"></div>

      <form id="login-form" novalidate>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="nama@email.com" autocomplete="email">
          <div class="error-text" role="alert"></div>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="Password" autocomplete="current-password">
          <div class="error-text" role="alert"></div>
        </div>
        <button type="submit" class="btn btn-block">Masuk</button>
      </form>

      <p class="auth-footer">Belum punya akun? <a href="register.html">Daftar di sini</a></p>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">&copy; <span id="year"></span> PerpusKu - UTS Pemrograman Web, Informatika UMM</div>
  </footer>

  <script src="assets/js/main.js"></script>
  <script src="assets/js/validation.js"></script>
</body>
</html>
