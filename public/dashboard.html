<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Anggota - PerpusKu</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="dashboard">

  <header class="site-header">
    <nav class="container navbar" aria-label="Navigasi utama">
      <a href="index.html" class="brand">Perpus<span>Ku</span></a>
      <button class="nav-toggle" aria-label="Buka menu">&#9776;</button>
      <ul class="nav-menu">
        <li><a href="katalog.html">Katalog</a></li>
        <li><a href="dashboard.html">Dashboard</a></li>
        <li><a href="login.html" class="btn btn-accent btn-sm">Keluar</a></li>
      </ul>
    </nav>
  </header>

  <main class="section">
    <div class="container">
      <h1 class="section-title">Halo, Anggota 👋 <small>Dashboard peminjaman</small></h1>

      <section class="grid grid-stats" style="margin-bottom:2rem" aria-label="Ringkasan">
        <div class="card stat-card"><div class="num" id="stat-aktif">0</div><div class="label">Sedang dipinjam</div></div>
        <div class="card stat-card"><div class="num" id="stat-terlambat">0</div><div class="label">Terlambat</div></div>
        <div class="card stat-card"><div class="num" id="stat-total">0</div><div class="label">Total riwayat</div></div>
      </section>

      <section>
        <h2 class="section-title">Riwayat Peminjaman</h2>
        <div class="card table-wrap">
          <table>
            <thead>
              <tr><th>Judul</th><th>Tgl Pinjam</th><th>Jatuh Tempo</th><th>Status</th><th>Aksi</th></tr>
            </thead>
            <tbody id="loan-body"></tbody>
          </table>
        </div>
      </section>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">&copy; <span id="year"></span> PerpusKu - UTS Pemrograman Web, Informatika UMM</div>
  </footer>

  <script src="assets/js/main.js"></script>
  <script src="assets/js/validation.js"></script>
  <script src="assets/js/dashboard.js"></script>
</body>
</html>
