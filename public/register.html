<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daftar Anggota - PerpusKu</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="register">

  <header class="site-header">
    <nav class="container navbar" aria-label="Navigasi utama">
      <a href="index.html" class="brand">Perpus<span>Ku</span></a>
      <button class="nav-toggle" aria-label="Buka menu">&#9776;</button>
      <ul class="nav-menu">
        <li><a href="index.html">Beranda</a></li>
        <li><a href="katalog.html">Katalog</a></li>
        <li><a href="login.html">Masuk</a></li>
        <li><a href="register.html" class="btn btn-accent btn-sm">Daftar</a></li>
      </ul>
    </nav>
  </header>

  <main class="auth-wrapper">
    <section class="card auth-card">
      <h1>Daftar Anggota</h1>
      <p class="sub">Buat akun untuk mulai meminjam buku.</p>

      <div id="form-alert" class="alert" role="alert"></div>

      <form id="register-form" novalidate>
        <div class="form-group">
          <label for="nama">Nama Lengkap</label>
          <input type="text" id="nama" name="nama" autocomplete="name">
          <div class="error-text" role="alert"></div>
        </div>
        <div class="form-group">
          <label for="nim">NIM</label>
          <input type="text" id="nim" name="nim" inputmode="numeric">
          <div class="error-text" role="alert"></div>
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" autocomplete="email">
          <div class="error-text" role="alert"></div>
        </div>
        <div class="form-group">
          <label for="telepon">Nomor HP</label>
          <input type="tel" id="telepon" name="telepon" placeholder="081234567890">
          <div class="error-text" role="alert"></div>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" autocomplete="new-password">
          <div class="form-hint">Minimal 8 karakter, kombinasi huruf dan angka.</div>
          <div class="error-text" role="alert"></div>
        </div>
        <div class="form-group">
          <label for="konfirmasi">Konfirmasi Password</label>
          <input type="password" id="konfirmasi" name="konfirmasi" autocomplete="new-password">
          <div class="error-text" role="alert"></div>
        </div>
        <button type="submit" class="btn btn-block">Daftar</button>
      </form>

      <p class="auth-footer">Sudah punya akun? <a href="login.html">Masuk</a></p>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">&copy; <span id="year"></span> PerpusKu - UTS Pemrograman Web, Informatika UMM</div>
  </footer>

  <script src="assets/js/main.js"></script>
  <script src="assets/js/validation.js"></script>
</body>
</html>
